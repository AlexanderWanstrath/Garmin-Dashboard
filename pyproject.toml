[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runlog"
version = "0.1.0"
description = "Personal running analytics dashboard built on the official Garmin Personal API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python>=1.0",
    "fitdecode>=0.10",
    "pyyaml>=6.0",
]

[project.scripts]
runlog = "runlog.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/runlog"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
